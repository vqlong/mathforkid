<h2 id="test-multiplication-header" class="mt-5 text-danger">Phép nhân</h2>
<div class="position-relative">
    <button class="btn btn-outline-success rounded-3 position-absolute top-0 end-0"
        onclick="CreateTestMultiplication(event)">Tạo phép tính</button>
    <a class="btn btn-success rounded-3 sticky-top" href="#message-box" data-bs-toggle="modal"
        onclick="CheckTestMultiplication(event)">Kiểm tra</a>
    <div
        class="test-multiplication d-flex justify-content-center flex-wrap my-2 p-1 border border-success rounded-4 text-success">
        1 x 1 = 2</div>
</div>
