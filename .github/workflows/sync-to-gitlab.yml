name: Sync to GitLab

on:
  push:
    branches:
      - main  # Hoặc thay bằng tên branch chính của bạn (ví dụ: master)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitLab
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: "https://oauth2:${{ secrets.GITLAB_TOKEN }}@https://gitlab.com/vqlong/mathforkid.git"
