<!DOCTYPE html>
<html lang="vi">

<head>
    <title>Bé học toán</title>
    <link rel="icon" href="./resources/img/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./resources/css/styles.css">
    <meta charset="UTF-8">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="description" content="Sample HTML">
    <meta name="author" content="Le Rachitique">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="6000">
</head>

<body>
    <header class="container">
        <div>
            <h1 class="text-danger mt-3">Học toán giúp phát triển tư duy</h1>
            <div class="carousel slide mt-3" data-bs-ride="carousel" id="carousel-demo">
                <div class="carousel-indicators">
                    <button class="active" data-bs-target="#carousel-demo" data-bs-slide-to="0"></button>
                    <button class="bg-danger" data-bs-target="#carousel-demo" data-bs-slide-to="1"></button>
                    <button class="bg-warning" data-bs-target="#carousel-demo" data-bs-slide-to="2"></button>
                    <button class="bg-success" data-bs-target="#carousel-demo" data-bs-slide-to="3"></button>
                    <button class="bg-info" data-bs-target="#carousel-demo" data-bs-slide-to="4"></button>
                    <button class="bg-primary" data-bs-target="#carousel-demo" data-bs-slide-to="5"></button>
                    <button class="bg-secondary" data-bs-target="#carousel-demo" data-bs-slide-to="6"></button>
                    <button class="bg-dark" data-bs-target="#carousel-demo" data-bs-slide-to="7"></button>
                </div>

                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img class="border border-success rounded-5 w-100" src="./resources/img/banner.png">
                    </div>
                    <div class="carousel-item">
                        <img class="border border-success rounded-5 w-100"
                            src="./resources/img/multiplication-table-5.jpg">
                    </div>
                    <div class="carousel-item">
                        <img class="border border-success rounded-5 w-100" src="./resources/img/multiplication.PNG">
                    </div>
                    <div class="carousel-item">
                        <img class="border border-success rounded-5 w-100" src="./resources/img/addition.png">
                    </div>
                    <div class="carousel-item">
                        <img class="border border-success rounded-5 w-100" src="./resources/img/division.png">
                    </div>
                    <div class="carousel-item">
                        <img class="border border-success rounded-5 w-100"
                            src="./resources/img/multiplication-table.jpg">
                    </div>
                    <div class="carousel-item">
                        <img class="border border-success rounded-5 w-100" src="./resources/img/subtraction.png">
                    </div>
                    <div class="carousel-item">
                        <img class="border border-success rounded-5 w-100" src="./resources/img/subtraction-1.png">
                    </div>
                </div>

                <button class="carousel-control-prev bg-successz" data-bs-target="#carousel-demo" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next bg-successz" data-bs-target="#carousel-demo" data-bs-slide="next">
                    <span class="carousel-control-next-icon border-warning"></span>
                </button>
            </div>
        </div>
    </header>
    <main class="container mt-5">
        <nav class="container navbar navbar-expand-md bg-gray-200 navbar-dark mt-3 rounded-3 z-index-2">
            <div class="container-fluid">
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navtop-collapse-content">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse navbar-nav" id="navtop-collapse-content">

                    <div class="dropdown">
                        <a class="nav-link dropdown-toggle text-success login-required" href="#"
                            data-bs-toggle="dropdown">Số lượng</a>
                        <div class="dropdown-menu text-success" style="width: 20rem;">
                            <form class="p-3 position-relative">
                                <div class="text-center">10</div>
                                <div class="slider-container w-100">
                                    <div></div>
                                    <div class="slider-filled-track"></div>
                                    <input type="range" class="form-range slider select-quantity" min="0" max="100"
                                        value="10" step="1">
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="dropdown mx-3">
                        <a class="nav-link dropdown-toggle text-success login-required" href="#"
                            data-bs-toggle="dropdown">Giới hạn</a>
                        <div class="dropdown-menu text-success">
                            <form class="p-3">
                                <div class="form-check">
                                    <label class="form-check-label">
                                        <input type="radio" class="form-check-input limit-20" name="f-radio-demo">20
                                    </label>
                                </div>
                                <div class="form-check">
                                    <label class="form-check-label">
                                        <input type="radio" class="form-check-input limit-100" name="f-radio-demo">100
                                    </label>
                                </div>
                                <div class="form-check">
                                    <label class="form-check-label">
                                        <input type="radio" class="form-check-input limit-1000" name="f-radio-demo"
                                            checked>1000
                                    </label>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="dropdown mx-3">
                        <a class="nav-link dropdown-toggle text-success login-required" href="#"
                            data-bs-toggle="dropdown">Phép tính</a>
                        <div class="dropdown-menu text-success" style="width: 16rem;">
                            <div class="form-check form-switch mx-3">
                                <input type="checkbox" class="form-check-input cursor-pointer" id="ckb-carry" checked>
                                <label class="form-check-label cursor-pointer" for="ckb-carry">Phép tính có nhớ</label>
                            </div>
                        </div>
                    </div>


                </div>

            </div>
        </nav>

        <div id="page-content">

        </div>

        <div class="modal fade" id="message-box">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content text-success">
                    <div class="modal-header bg-gray-100 text-danger">
                        <h3 class="modal-title w-100">Bé học toán</h3>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p id="message-box-body" class="text-center">Thông báo.</p>
                    </div>
                    <div class="modal-footer bg-gray-100">
                        <button class="btn btn-success" data-bs-dismiss="modal">OK</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="login-box" id="login-box">
            <div class="login-box-content">
                <div class="login-header">
                    <h3 class="login-title">Đăng nhập</h3>
                    <button id="btn-close-login">&times;</button>
                </div>
                <div class="login-body">
                    <form class="login-form" onsubmit="return false;">
                        <label for="login-username" class="login-label">Tên đăng nhập:<br />
                            <input type="text" name="" id="login-username" class="login-data">
                        </label>
                        <label for="login-password" class="login-label">Mật khẩu:<br />
                            <input type="password" name="" id="login-password" class="login-data">
                        </label>
                        <label id="login-status" class="login-label text-danger"></label>
                    </form>
                </div>
                <div class="login-footer">
                    <button id="btn-register" class="btn btn-outline-success login-btn">Đăng ký</button>
                    <button id="btn-login" class="btn btn-success login-btn">Đăng nhập</button>
                </div>
            </div>
        </div>

        <div class="input-box" id="input-box">
            <div class="input-box-content">
                <div class="input-header">
                    <h3 class="input-title">Bé học toán</h3>
                    <button id="btn-close-input">&times;</button>
                </div>
                <div class="input-body">
                    <form class="input-form" onsubmit="return false;">
                        <label for="input-data" class="input-label">
                            <p id="input-prompt" class="input-prompt">Nhập mật khẩu:</p>
                            <input type="text" name="input-data" id="input-data" class="input-data">
                        </label>
                    </form>
                </div>
                <div class="input-footer">
                    <button id="btn-ok-input" class="btn btn-success">OK</button>
                </div>
            </div>
        </div>

        <nav class="container navbar navbar-expand-md bg-success navbar-dark mt-3 rounded-3 sticky-bottom z-index-1">
            <div class="container-fluid">
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbot-collapse-content">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse navbar-nav" id="navbot-collapse-content">
                    <a class="nav-link" href="./resources/html/sorting.html">Sắp xếp</a>

                    <a class="nav-link" href="./resources/html/addition.html">Phép cộng</a>

                    <a class="nav-link" href="./resources/html/subtraction.html">Phép trừ</a>

                    <a class="nav-link" href="./resources/html/multiplication.html">Phép nhân</a>

                    <a class="nav-link" href="./resources/html/multiplication3.html">Phép nhân &gt;.&lt;</a>

                    <a class="nav-link" href="./resources/html/division.html">Phép chia</a>
                </div>

                <div>
                    <label id="label-username" class="text-light">[not login]</label>
                </div>
            </div>
        </nav>

        <button class="btn btn-scroll-bot btn-success position-fixed top-0 end-0 m-2 z-index-2"
            onclick="window.scrollTo(0, document.body.scrollHeight)"></button>
        <button class="btn btn-scroll-top btn-success position-fixed bottom-0 end-0 mx-2 z-index-2"
            onclick="window.scrollTo(0, 0)"></button>

    </main>
    <footer>
        <div>
            <h2 class="text-danger">Tất cả vì tương lai con em chúng ta</h2>
        </div>
    </footer>
    <script src="./resources/js/scripts.js"></script>
    <script src="./resources/js/sorting.js"></script>
    <script src="./resources/js/addition.js"></script>
    <script src="./resources/js/subtraction.js"></script>
    <script src="./resources/js/multiplication.js"></script>
    <script src="./resources/js/multiplication3.js"></script>
    <script src="./resources/js/division.js"></script>
</body>

</html>
